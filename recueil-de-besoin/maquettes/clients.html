<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KOLONI - Clients</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f8f9fa; color: #333; }
    header { background-color: #ffffff; border-bottom: 2px solid #e2e8f0; padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-weight: bold; font-size: 1.2rem; margin-right: 20px; }
    nav { display: flex; gap: 15px; align-items: center; flex-grow: 1; }
    nav a { text-decoration: none; color: #4a5568; padding: 6px 12px; border-radius: 4px; font-weight: 500; }
    nav a.active { color: #d97706; border-bottom: 2px solid #f59e0b; font-weight: bold; }
    .user-nav { display: flex; align-items: center; gap: 15px; }
    .user-nav a { text-decoration: none; color: #4a5568; display: flex; align-items: center; gap: 5px; font-weight: 500; }
    main { max-width: 1200px; margin: 20px auto; padding: 0 20px; }
    .title { font-size: 1.2rem; font-weight: bold; margin-bottom: 15px; border-bottom: 2px solid #333; display: inline-block; padding-bottom: 2px; }
    .search-box { display: flex; align-items: center; background-color: white; border-bottom: 2px solid #000; margin-bottom: 15px; padding: 4px 8px; max-width: 600px; }
    .search-box input { border: none; outline: none; width: 100%; font-size: 1rem; }
    .filters-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
    .filter-group { display: flex; gap: 10px; flex-wrap: wrap; }
    select, button { padding: 6px 12px; border: 1px solid #000; background: white; border-radius: 4px; font-size: 0.9rem; cursor: pointer; }
    .btn-action { font-weight: bold; }
    .table-container { background-color: white; border: 2px solid #000; border-radius: 4px; overflow: hidden; min-height: 300px; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { padding: 12px 16px; border-bottom: 2px solid #000; font-weight: 600; background-color: #fafafa; }
  </style>
</head>
<body>
  <header>
    <div class="logo" ref="index.html">KOLONI</div>
    <nav>
      <a href="index.html">Dashboard</a>
      <a href="opportunities.html">Opportunities</a>
      <a href="clients.html" class="active">Clients</a>
      <a href="contacts.html">Contacts</a>
    </nav>
    <div class="user-nav">
      <a href="user.html">👤 User</a>
      <span>☀️</span>
    </div>
  </header>
  <main>
    <div class="title">Clients:</div>
    <div class="search-box">
      <input type="text" placeholder="Recherche">
      <span>🔍</span>
    </div>
    <div class="filters-bar">
      <div class="filter-group">
        <select><option>Entreprise </option></select>
      </div>
      <div class="filter-group">
        <button class="btn-action">Réinitialiser</button>
        <button class="btn-action">Valider</button>
      </div>
    </div>
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Nom et Prénom</th>
            <th>Entreprise ⇅</th>
            <th>Poste</th>
            <th>Détails</th>
          </tr>
        </thead>
        <tbody>
          <!-- Données à afficher -->
        </tbody>
      </table>
    </div>
  </main>
</body>
</html>
