<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KOLONI - User</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f8f9fa; color: #333; }
    header { background-color: #ffffff; border-bottom: 2px solid #e2e8f0; padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-weight: bold; font-size: 1.2rem; margin-right: 20px; }
    nav { display: flex; gap: 15px; align-items: center; flex-grow: 1; }
    nav a { text-decoration: none; color: #4a5568; padding: 6px 12px; border-radius: 4px; font-weight: 500; }
    .user-nav { display: flex; align-items: center; gap: 15px; }
    .user-nav a { text-decoration: none; color: #4a5568; display: flex; align-items: center; gap: 5px; font-weight: 500; }
    .user-nav a.active { color: #d97706; border-bottom: 2px solid #f59e0b; font-weight: bold; }
    main { max-width: 1200px; margin: 20px auto; padding: 0 20px; }
    .title { font-size: 1.2rem; font-weight: bold; margin-bottom: 25px; border-bottom: 2px solid #333; display: inline-block; padding-bottom: 2px; }
    .form-container { display: flex; flex-direction: column; gap: 12px; max-width: 700px; font-size: 1.1rem; }
    .form-row { display: flex; align-items: center; gap: 10px; }
    .form-row label { width: 140px; font-weight: 500; }
    .inline-fields { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
    select, input[type="text"] { padding: 6px 12px; border: 1px solid #000; border-radius: 4px; background: white; }
    textarea { width: 100%; border: 2px solid #000; border-radius: 4px; height: 120px; margin-top: 5px; padding: 10px; font-size: 1rem; }
  </style>
</head>
<body>
  <header>
    <div class="logo">KOLONI</div>
    <nav>
      <a href="index.html">Dashboard</a>
      <a href="opportunities.html">Opportunities</a>
      <a href="clients.html">Clients</a>
      <a href="contacts.html">Contacts</a>
    </nav>
    <div class="user-nav">
      <a href="user.html" class="active">👤 User</a>
      <a href="admin.html">⚙️ Admin</a>
      <span>☀️</span>
    </div>
  </header>
  <main>
    <div class="title">Paramètre du compte :</div>
    <div class="form-container">
      <div class="form-row"><label>Nom :</label> <span>Nicolas</span></div>
      <div class="form-row"><label>Prénom :</label> <span>D.</span></div>
      <div class="form-row"><label>Mail :</label> <span>nicolas.d@koloni.fr</span></div>
      <div class="form-row"><label>Téléphone :</label> <span>06 00 00 00 00</span></div>
      <div class="form-row"><label>Ville :</label> <span>Toulouse</span></div>
      <div class="form-row inline-fields">
        <label>Disponibilité :</label>
        <select><option>En mission v</option><option>Disponible</option></select>
        <label style="width: auto;">Date de fin mission :</label>
        <input type="text" value="10/10/2026">
      </div>
      <div>
        <label>Note :</label>
        <textarea placeholder="..."></textarea>
      </div>
    </div>
  </main>
</body>
</html>
