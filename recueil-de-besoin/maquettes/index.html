<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KOLONI - Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f8f9fa; color: #333; }
    header { background-color: #ffffff; border-bottom: 2px solid #e2e8f0; padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-weight: bold; font-size: 1.2rem; margin-right: 20px; }
    nav { display: flex; gap: 15px; align-items: center; flex-grow: 1; }
    nav a { text-decoration: none; color: #4a5568; padding: 6px 12px; border-radius: 4px; font-weight: 500; }
    nav a.active { color: #d97706; border-bottom: 2px solid #f59e0b; font-weight: bold; }
    .user-nav { display: flex; align-items: center; gap: 15px; }
    .user-nav a { text-decoration: none; color: #4a5568; display: flex; align-items: center; gap: 5px; font-weight: 500; }
    .user-nav a.active { color: #d97706; border-bottom: 2px solid #f59e0b; font-weight: bold; }
    main { max-width: 1200px; margin: 20px auto; padding: 0 20px; }
    .title { font-size: 1.2rem; font-weight: bold; margin-bottom: 15px; border-bottom: 2px solid #333; display: inline-block; padding-bottom: 2px; }
    .search-box { display: flex; align-items: center; background-color: white; border-bottom: 2px solid #000; margin-bottom: 20px; padding: 4px 8px; max-width: 600px; }
    .search-box input { border: none; outline: none; width: 100%; font-size: 1rem; }
    .table-container { background-color: white; border: 2px solid #000; border-radius: 4px; overflow: hidden; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 12px 16px; }
    th { border-bottom: 2px solid #000; font-weight: 600; background-color: #fafafa; }
    tr:not(:last-child) td { border-bottom: 1px solid #e2e8f0; }
    .badge { padding: 4px 8px; border-radius: 4px; font-size: 0.85rem; font-weight: bold; }
    .badge-encours { background-color: #fef3c7; color: #92400e; }
    .badge-signe { background-color: #d1fae5; color: #065f46; }
  </style>
</head>
<body>
  <header>
    <div class="logo">KOLONI</div>
    <nav>
      <a href="index.html" class="active">Dashboard</a>
      <a href="opportunities.html">Opportunities</a>
      <a href="clients.html">Clients</a>
      <a href="contacts.html">Contacts</a>
    </nav>
    <div class="user-nav">
      <a href="user.html">👤 User</a>
      <span>☀️</span>
    </div>
  </header>
  <main>
    <div class="title">Opportunities en cours:</div>
    <div class="search-box">
      <input type="text" placeholder="Recherche">
      <span>🔍</span>
    </div>
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Titre ⇅</th>
            <th>Client ⇅</th>
            <th>Ville ⇅</th>
            <th>Apporteur ⇅</th>
            <th>Status ⇅</th>
            <th>Date Signal ⇅</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>EDF</td>
            <td>Nicolas D.</td>
            <td>Toulouse</td>
            <td>François A.</td>
            <td><span class="badge badge-encours">En cours</span></td>
            <td>23/09/2026</td>
          </tr>
          <tr>
            <td>Orange</td>
            <td>Dupont D.</td>
            <td>Lyon</td>
            <td>Alexia P.</td>
            <td><span class="badge badge-signe">Signé</span></td>
            <td>10/08/2026</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>
</body>
</html>
